    on this gap alone \\u2014 corroborate with ingest errors in `utm-statistics-service`
    before concluding anything.\\n\\nNote the live store has a genuine lifecycle spread
    (PROPOSED / AUTHORIZED / ACTIVATED / CLOSED) whereas the statistics copy is entirely
    CLOSED \\u2014 they capture different stages, so a count difference is expected
    by design.\\n\\n---\\n\\n### `ops-subscription` \\u2014 NOT TIME-FILTERABLE\\n\\nConfirmed
    via `_field_caps`: every field (`state`, `subscriptionType`, `providerId`, `dataFormat`)
