  04-ceph-storage.json: "{\r\n  \"uid\": \"utm-obs-04-ceph\",\r\n  \"title\": \"04
    - Ceph & Storage Health\",\r\n  \"description\": \"**Purpose:** first-class storage-infrastructure
    dashboard. Ceph underpins every stateful UTM workload; storage degradation surfaces
    as unexplained application failures.\\n\\n**Data sources:** Prometheus scraping
    `rook-ceph-mgr:9283` (412 ceph_* metrics), plus kubelet volume stats for PVCs.\\n\\n**IMPORTANT
    \\u2014 this required an infrastructure fix.** Before this work, Prometheus held
    ZERO `ceph_*` metrics: rook-ceph-mgr served them but no ServiceMonitor existed
    in the `rook-ceph` namespace (all 17 ServiceMonitors were in `monitoring`). A
    ServiceMonitor was added \\u2014 no new exporter was deployed.\\n\\n**Known limitation:**
    per-OSD byte utilisation is not exposed by ceph-mgr. See the gap panel.\\n\\n**Why
    this matters operationally:** HDD-backed OSDs + node disks above 80% produce BlueStore
