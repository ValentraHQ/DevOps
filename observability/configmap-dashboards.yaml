    \     \"pluginVersion\": \"12.1.1\",\r\n      \"targets\": [\r\n        {\r\n
    \         \"refId\": \"A\",\r\n          \"datasource\": {\r\n            \"type\":
    \"mysql\",\r\n            \"uid\": \"dor-be-mysql\"\r\n          },\r\n          \"format\":
    \"table\",\r\n          \"rawSql\": \"SELECT ABS( (SELECT COUNT(*) FROM dor_keycloak.user_entity
    ue JOIN dor_keycloak.realm r ON r.id = ue.realm_id WHERE r.name = 'utm-dor') -
    (SELECT COUNT(*) FROM dor_be.users) ) AS value\",\r\n          \"rawQuery\": true,\r\n
    \         \"editorMode\": \"code\"\r\n        }\r\n      ]\r\n    },\r\n    {\r\n
    \     \"id\": 136,\r\n      \"type\": \"text\",\r\n      \"title\": \"Why this
    matters\",\r\n      \"gridPos\": {\r\n        \"h\": 5,\r\n        \"w\": 6,\r\n
    \       \"x\": 18,\r\n        \"y\": 52\r\n      },\r\n      \"options\": {\r\n
    \       \"mode\": \"markdown\",\r\n        \"code\": {\r\n          \"language\":
    \"plaintext\",\r\n          \"showLineNumbers\": false,\r\n          \"showMiniMap\":
    false\r\n        },\r\n        \"content\": \"**Divergence should be 0.**\\n\\n`com.skyzr.keycloak`
    (in `basic-storage-provider-1.0.jar`) is compiled against `javax.ws.rs` but runs
    on **Keycloak 25**, which uses `jakarta.ws.rs`. REGISTER events therefore fail
    with `NoClassDefFoundError: javax/ws/rs/core/Response$Status` **after** the Keycloak
    identity is created but **before** DOR provisioning finishes.\\n\\nResult: an
    identity exists in Keycloak with no usable DOR account \\u2014 the user can authenticate
    but every admin action on them returns 500 (`User could not be found in Keycloak`,
    or the reverse).\\n\\nThis panel makes an otherwise silent defect visible. It
    is a **detector, not a fix** \\u2014 the JAR must be rebuilt against Jakarta.\"\r\n
    \     },\r\n      \"pluginVersion\": \"12.1.1\",\r\n      \"transparent\": false\r\n
    \   },\r\n    {\r\n      \"id\": 137,\r\n      \"type\": \"text\",\r\n      \"title\":
    \"Scope, data protection and current volume\",\r\n      \"gridPos\": {\r\n        \"h\":
    10,\r\n        \"w\": 24,\r\n        \"x\": 0,\r\n        \"y\": 57\r\n      },\r\n
    \     \"options\": {\r\n        \"mode\": \"markdown\",\r\n        \"code\": {\r\n
    \         \"language\": \"plaintext\",\r\n          \"showLineNumbers\": false,\r\n
    \         \"showMiniMap\": false\r\n        },\r\n        \"content\": \"### What
    this dashboard reads\\n\\nElasticsearch-backed dashboards in this suite read historical
    statistics copies. **This one queries `dor_be` directly** \\u2014 the live MariaDB
    behind the `/pm/` portal. Figures are current, not a snapshot.\\n\\nBecause it
    is a live transactional database, every panel aggregates and the dashboard refreshes
    at **5m**, not the 30s used for infrastructure dashboards.\\n\\n### Data protection\\n\\nGrafana
    connects as `grafana_ro`, which holds **SELECT-only, column-scoped** grants on
    `dor_be`. Not granted, and therefore unreachable even from Explore:\\n\\n- `users.email`,
    `first_name`, `last_name`, `phone`, `birthdate`\\n- `users.internal_notes`, `activity_log`,
    `pilot_number`, `skid`\\n- `organisations.phone`, `vat_no`, `org_id_no`, `insurance_no`,
    `internal_notes`\\n- document `file_name` and `*_uuid` columns\\n- the entire
    `addresses` table\\n\\nOrganisation **names** are shown \\u2014 those are company
    identifiers, not personal data.\\n\\n### Expect low numbers right now\\n\\nAt
    build time the registry held **2 organisations, 1 user, 0 drones, 0 assets**.
    The panels are correct; the registry is simply near-empty following the user cleanup.
    Zeros here mean *no records yet*, not *query failure* \\u2014 every stat carries
    an explicit `NO DATA` state that is visually distinct from a real zero.\"\r\n
    \     },\r\n      \"pluginVersion\": \"12.1.1\",\r\n      \"transparent\": false\r\n
    \   }\r\n  ]\r\n}"
