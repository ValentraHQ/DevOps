    \"plaintext\",\r\n          \"showLineNumbers\": false,\r\n          \"showMiniMap\":
    false\r\n        },\r\n        \"content\": \"### What this reads\\n\\n`keycloak.event_entity`
    on `core-database` \\u2014 the **live** event log of the core Keycloak (`utm-core/keycloak`,
    Keycloak **23.0.5**, served at `/keycloak/auth`). Verified at build time: **3,480
    events**, 2026-08-26 \\u2192 now, all in the `swim` realm.\\n\\n### Data protection\\n\\n`grafana_ro`
    holds SELECT on counting columns only. Deliberately **not** granted, so unreachable
    even from Explore: `IP_ADDRESS`, `DETAILS_JSON`, `DETAILS_JSON_LONG_VALUE`, `SESSION_ID`,
    and every username/email column on `user_entity`. `USER_ID` is an opaque UUID
    used only for `COUNT(DISTINCT ...)` and is never displayed.\\n\\n### \\u26a0\\ufe0f
    Known gap \\u2014 no Keycloak runtime metrics\\n\\n`KC_METRICS_ENABLED` is unset
    and `/keycloak/auth/metrics` returns **404**, so Keycloak publishes no Prometheus
    metrics: no login latency, no token issuance rate, no session gauges, no JVM/GC
    detail. The *Keycloak Service Health* row above is container-level only (kube-state-metrics
    + cAdvisor).\\n\\nClosing it means setting `KC_METRICS_ENABLED=true` and **restarting
    the core identity provider**, which briefly interrupts authentication for the
    entire platform. That is a maintenance-window change, not a routine one.\\n\\n###
    Event-log retention\\n\\nKeycloak expires events per realm (`realm.events_expiration`).
    If that is set, this dashboard's history is bounded by it \\u2014 a flat older
    region means expiry, not inactivity.\"\r\n      },\r\n      \"pluginVersion\":
