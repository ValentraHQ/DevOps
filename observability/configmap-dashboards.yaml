    |\\n\\nEvery ServiceMonitor that existed before this work lived in the `monitoring`
    namespace and targeted the monitoring stack itself \\u2014 kubelet, apiserver,
    etcd, node-exporter, kube-state-metrics. None targeted a UTM application.\\n\\n###
    What this means operationally\\n\\nYou can see **that** a UTM pod is unhealthy
    (restarts, OOM, readiness), but not **why** in application terms. There is no
    way to answer:\\n\\n- What is the request rate to `operation-plan-service`?\\n-
    What percentage of requests are returning 5xx?\\n- What is p95 latency for `conflict-detection`?\\n\\n###
