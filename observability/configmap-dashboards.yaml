    \       \"code\": {\r\n          \"language\": \"plaintext\",\r\n          \"showLineNumbers\":
    false,\r\n          \"showMiniMap\": false\r\n        },\r\n        \"content\":
    \"### Status: NO DATA (fields exist, values are empty)\\n\\nThe `uas_9.0.0` mapping
    defines ED-269 and LARA extended properties, but aggregating them over all 168
    documents returns **zero buckets**. Verified empty:\\n\\n| Field | Result |\\n|---|---|\\n|
    `ed269Properties.uSpaceClass` | empty |\\n| `ed269Properties.restrictionCondition`
    | empty |\\n| `uasZone.restrictionConditions` | empty |\\n| `laraAirspaceProperties.isLaraAirspace`
    | empty |\\n| `uasZone.extendedProperties.active` | empty |\\n\\nNo panels are
    built on these fields. An empty chart here would imply *zero zones have restrictions*,
    which is a different and misleading claim from *this attribute is not populated
    in the source data*.\\n\\n**Action:** confirm with the data owner whether the
    ingest pipeline is expected to populate ED-269 extended properties. If it is,
    this is a data-quality defect upstream.\"\r\n      },\r\n      \"pluginVersion\":
    \"12.1.1\",\r\n      \"transparent\": false\r\n    },\r\n    {\r\n      \"id\":
    114,\r\n      \"type\": \"text\",\r\n      \"title\": \"How the map is produced\",\r\n
    \     \"gridPos\": {\r\n        \"h\": 9,\r\n        \"w\": 12,\r\n        \"x\":
    12,\r\n        \"y\": 22\r\n      },\r\n      \"options\": {\r\n        \"mode\":
    \"markdown\",\r\n        \"code\": {\r\n          \"language\": \"plaintext\",\r\n
    \         \"showLineNumbers\": false,\r\n          \"showMiniMap\": false\r\n
    \       },\r\n        \"content\": \"### Geometry is derived, not read directly\\n\\n`uas_9.0.0`
    stores geometry as **`geo_shape` inside a `nested` field** (`uasZone.geometry.geom`).
    Grafana's Elasticsearch datasource can aggregate neither `nested` fields nor `geo_shape`,
    so it cannot map that index directly.\\n\\n`uas-zones-geo` is a **read-only derivation**:
    each zone's polygon is reduced to a parent-level `centroid` geo_point, which `geohash_grid`
    can aggregate. The source index is never modified.\\n\\n**Centroid method:** arithmetic
    mean of the exterior ring's vertices, excluding the GeoJSON closing vertex. This
    is a *vertex* centroid, not an area centroid \\u2014 for these airspace polygons
    the difference is negligible and it can never fall outside the bounding box. Verified
    precondition: all 168 zones hold exactly one `Polygon` (168 docs : 168 nested
    geometry entries).\\n\\n**A centroid is a point, not the zone.** A large or irregular
    zone is drawn at its centre, so the map shows *where zones are*, not their true
    extent. For exact boundaries use the source geometry.\\n\\n**Refresh:** rebuild
    with `uas-zones-geo-build.sh`. The freshness row below compares counts so staleness
    is visible rather than silent.\"\r\n      },\r\n      \"pluginVersion\": \"12.1.1\"\r\n
