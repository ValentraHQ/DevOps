    has **no date field**.\\n\\nGrafana's Elasticsearch datasource always applies
    a time filter and requires aggregatable fields for terms panels, so no live subscription
    panel can be built. Validated count at build time: **8 documents**.\\n\\n**To
    fix:** add `keyword` sub-fields and a timestamp to the `ops-subscription` mapping.\"\r\n
