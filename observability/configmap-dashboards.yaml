    \"00 - UTM Executive Platform Overview\",\r\n  \"description\": \"**Purpose:**
    single-screen operational summary of the UTM platform, with drill-down to every
    detailed dashboard via the *UTM Observability* menu.\\n\\n**Data sources:** Prometheus
