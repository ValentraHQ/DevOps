    \"background_solid\",\r\n        \"graphMode\": \"none\",\r\n        \"justifyMode\":
    \"auto\",\r\n        \"orientation\": \"auto\",\r\n        \"textMode\": \"auto\",\r\n
    \       \"wideLayout\": true,\r\n        \"showPercentChange\": false,\r\n        \"reduceOptions\":
