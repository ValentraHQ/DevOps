    operation-plan-wrapper, operation-plan-result), utm-generic-statistics.\\n\\n**Known
    limitations:** UTM application services are NOT instrumented into Prometheus,
    so no service-level RED metrics exist. Application logs are unavailable. See *08
    - Observability Coverage*.\\n\\n**Interpretation:** business-data KPIs (zones,
    plans, events) reflect historical datasets and are not live telemetry \\u2014
    check *Data Freshness* on each detail dashboard.\",\r\n  \"tags\": [\r\n    \"utm-observability\",\r\n
