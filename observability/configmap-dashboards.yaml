    lon 12.0\\u201327.7 (Sweden and Estonia).\",\r\n      \"datasource\": {\r\n        \"type\":
    \"elasticsearch\",\r\n        \"uid\": \"core-es7-uasgeo\"\r\n      },\r\n      \"gridPos\":
    {\r\n        \"h\": 14,\r\n        \"w\": 16,\r\n        \"x\": 0,\r\n        \"y\":
