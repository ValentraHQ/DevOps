# Loki single-binary ("monolithic" target) deployment for utm-statistics.
#
# WHY single-binary, not simple-scalable/microservices: this closes a
# documented dashboard gap (08-observability-coverage.json panel 110,
# "Application Logs — NOT AVAILABLE") for a cluster this size. Microservices
# mode exists for horizontal scale this cluster doesn't need; single-binary
# is one Deployment + one PVC, matching the footprint of every other
# component in utm-statistics (Jaeger, Tempo, ES7 are all similarly modest).
#
# WHY a bounded PVC + explicit retention: this cluster's documented
# characteristic failure mode is Ceph disk-fill cascading into MON_DISK_LOW
# -> slow ops -> restart storms. Unbounded log ingestion is exactly the kind
# of thing that causes that. 30Gi PVC, 14-day retention enforced by the
# compactor — not "whatever fits", a real ceiling.
#
# Storage: filesystem (rook-ceph-block PVC), not S3 — no S3-compatible
# object store confirmed available in this cluster, and filesystem is
# sufficient at this scale.
#
# Index: TSDB (schema v13) — boltdb-shipper is legacy; TSDB is Loki's
# current recommended index for filesystem/object storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: utm-statistics
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 336h            # 14 days — bounded, see header
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 15MB
      max_query_series: 5000
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 2h

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: utm-statistics
  labels:
    app: loki
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: utm-statistics
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — avoid the Multi-Attach deadlock
                               # this cluster has already hit once (Grafana)
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # rook-ceph CSI node-plugins (both rbd and cephfs) have been
                  # CrashLoopBackOff on this node for 58-170 days, predating
                  # this deployment. Avoid it until that's fixed separately.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [utm-kubernetes-node-004]
      containers:
        - name: loki
          image: harbor.ops.io/utm-devops/loki:3.7.8
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data,   mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: utm-statistics
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - { name: http, port: 3100, targetPort: http }
    - { name: grpc, port: 9096, targetPort: grpc }
